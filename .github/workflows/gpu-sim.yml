name: GPU tests (simulated)

# Optional, non-required check. The runners have no GPU, so this runs a subset
# of the unit tests on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behaviour or timing, so it complements real-GPU testing and
# does not replace it.

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  gpu-tests:
    name: tests on a simulated H100
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev libyaml-cpp-dev python3-numpy

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@dda0c8df8d72627c295edbae525354ba2bcb1687 # v0.1.4
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      - name: Configure
        run: |
          # 80-virtual embeds PTX only: the simulator JIT-compiles PTX and does not run SASS.
          # The setup action exports CMAKE_TOOLCHAIN_FILE, and this project skips its
          # tests whenever a toolchain file is set, so unset it for the configure step.
          NVCC=$(command -v nvcc || echo /usr/local/cuda-13.0/bin/nvcc)
          env -u CMAKE_TOOLCHAIN_FILE cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER="$NVCC" \
            -DCMAKE_CUDA_ARCHITECTURES=80-virtual \
            -DMPPI_CUDA_ARCH_LIST=80-virtual \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared \
            -DMPPI_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j --target math_utils_test cuda_math_utils_tests miscellaneous_tests

      # The speed benchmarks and the batched Gauss-Jordan test are too slow on a
      # simulated GPU, so they are skipped.
      - name: Test
        working-directory: build/tests
        run: |
          vgpu run ./math_utils/math_utils_test --gtest_filter='-*Speed*:*Batched*'
          vgpu run ./math_utils/cuda_math_utils_tests
          vgpu run ./misc/miscellaneous_tests

      - name: Free disk space
        if: always()
        run: |
          df -h /
          rm -rf build
          df -h /
